
name: BMP280 Python HIL CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "i2c/lab02_i2c_master/hil/**"
      - ".github/workflows/bmp280-python-hil-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "i2c/lab02_i2c_master/hil/**"
      - ".github/workflows/bmp280-python-hil-ci.yml"

  workflow_dispatch:

jobs:
  simulated-tests:
    name: Python Simulated HIL Tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: i2c/lab02_i2c_master/hil

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: i2c/lab02_i2c_master/hil/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify simulation test collection
        shell: bash
        run: |
          python - <<'PY'
          import pytest

          EXPECTED_TESTS = 8

          class TestCounter:
              def __init__(self):
                  self.count = 0

              def pytest_collection_finish(self, session):
                  self.count = len(session.items)

          counter = TestCounter()

          result = pytest.main(
              [
                  "-c", "pytest.ini",
                  "--collect-only", "-q",
                  "-m", "simulation",
              ],
              plugins=[counter],
          )

          if result != 0:
              raise SystemExit(
                  f"Pytest collection failed: {result}"
              )

          if counter.count != EXPECTED_TESTS:
              raise SystemExit(
                  f"Expected {EXPECTED_TESTS} tests, "
                  f"collected {counter.count}"
              )

          print(f"Verified {counter.count} simulation tests")
          PY

      - name: Run simulated HIL tests
        run: |
          mkdir -p reports
          python -m pytest -c pytest.ini -v -m simulation \
            --junitxml=reports/simulation-results.xml \
            --html=reports/simulation-report.html \
            --self-contained-html

      - name: Upload simulation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmp280-simulation-reports
          path: i2c/lab02_i2c_master/hil/reports/
          if-no-files-found: warn
          retention-days: 14
