
name: SPI Lab 03 - BMP280 CI

on:
  push:
    branches:
      - main
    paths:
      - "spi/lab03_spi_master/hil/**"
      - "spi/lab03_spi_master/main/**"
      - "spi/lab03_spi_master/tests/**"
      - ".github/workflows/spi-lab03-ci.yml"

  pull_request:
    paths:
      - "spi/lab03_spi_master/hil/**"
      - "spi/lab03_spi_master/main/**"
      - "spi/lab03_spi_master/tests/**"
      - ".github/workflows/spi-lab03-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------
  # Job 1: Python protocol simulation
  # ---------------------------------------------------
  spi-bmp280-simulation:
    name: SPI BMP280 simulation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: spi/lab03_spi_master/hil

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spi/lab03_spi_master/hil/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run simulated HIL tests
        run: |
          mkdir -p reports
          python -m pytest --device sim \
            --junitxml=reports/spi-simulation.xml

      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spi-lab03-simulation-report
          path: spi/lab03_spi_master/hil/reports/spi-simulation.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------
  # Job 2: Host-native C unit tests
  # ---------------------------------------------------
  spi-native-tests:
    name: SPI native C tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure native tests
        run: |
          cmake \
            -S spi/lab03_spi_master/tests/native \
            -B spi/lab03_spi_master/build-native \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build native tests
        run: |
          cmake --build \
            spi/lab03_spi_master/build-native \
            --parallel 2

      - name: Run native C tests
        run: |
          ctest \
            --test-dir spi/lab03_spi_master/build-native \
            --output-on-failure \
            --output-junit spi-native.xml

      - name: Upload native C test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spi-lab03-native-report
          path: spi/lab03_spi_master/build-native/spi-native.xml
          if-no-files-found: warn
          retention-days: 14
  # ---------------------------------------------------
  # Job 3: Production C coverage qualification
  # ---------------------------------------------------
  spi-coverage-gate:
    name: SPI BMP280 coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GCOVR
        run: |
          python -m pip install "gcovr==8.7"

      - name: Verify coverage toolchain
        run: |
          gcc --version
          gcov --version
          cmake --version
          python -m gcovr --version

      - name: Configure instrumented native tests
        run: |
          cmake \
            -S spi/lab03_spi_master/tests/native \
            -B spi/lab03_spi_master/build-coverage-ci \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON

      - name: Build instrumented native tests
        run: |
          cmake --build \
            spi/lab03_spi_master/build-coverage-ci \
            --parallel 2

      - name: Execute native tests
        run: |
          ctest \
            --test-dir spi/lab03_spi_master/build-coverage-ci \
            --output-on-failure \
            --output-junit spi-coverage-tests.xml

      - name: Generate HTML coverage report
        run: |
          mkdir -p spi/lab03_spi_master/reports/coverage-ci

          python -m gcovr \
            --root spi/lab03_spi_master/main \
            --filter '.*spi_bus\.c$' \
            --filter '.*bmp280_spi\.c$' \
            --exclude '.*tests/.*' \
            --object-directory spi/lab03_spi_master/build-coverage-ci \
            --gcov-executable gcov \
            --html-details \
            spi/lab03_spi_master/reports/coverage-ci/index.html \
            --print-summary

      - name: Enforce coverage thresholds
        run: |
          python -m gcovr \
            --root spi/lab03_spi_master/main \
            --filter '.*spi_bus\.c$' \
            --filter '.*bmp280_spi\.c$' \
            --exclude '.*tests/.*' \
            --object-directory spi/lab03_spi_master/build-coverage-ci \
            --gcov-executable gcov \
            --fail-under-line 90 \
            --fail-under-branch 80 \
            --print-summary

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spi-lab03-coverage-report
          path: |
            spi/lab03_spi_master/reports/coverage-ci/
            spi/lab03_spi_master/build-coverage-ci/spi-coverage-tests.xml
          if-no-files-found: warn
          retention-days: 14
